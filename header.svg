<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <style>
      .bg-main{fill:#030712}
      .gl{stroke:rgba(0,255,204,0.07);stroke-width:0.6;fill:none}
      .gl-v{stroke:rgba(124,58,237,0.06);stroke-width:0.6;fill:none}
      .scan-bar{fill:rgba(0,255,204,0.035);animation:scanMove 4s linear infinite}
      @keyframes scanMove{0%{transform:translateY(-10px);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translateY(310px);opacity:0}}
      .cl{stroke:rgba(0,255,204,0.45);stroke-width:2;fill:none;stroke-linecap:square;opacity:0;animation:fadeIn 0.5s ease 2s forwards}
      .name-t{font-family:'Courier New',monospace;font-size:56px;font-weight:900;letter-spacing:-1px;fill:url(#gn);opacity:0;animation:riseIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.4s forwards}
      .role-t{font-family:'Courier New',monospace;font-size:14px;letter-spacing:3.5px;fill:rgba(0,255,204,0.85);opacity:0;animation:riseIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.9s forwards}
      .bar-l{stroke:rgba(0,255,204,0.4);stroke-width:1.5;fill:none;stroke-dasharray:220;stroke-dashoffset:220;animation:drawLine 0.8s ease 1.3s forwards}
      .bar-r{stroke:rgba(124,58,237,0.5);stroke-width:1.5;fill:none;stroke-dasharray:220;stroke-dashoffset:220;animation:drawLine 0.8s ease 1.3s forwards}
      .tag-t{font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;fill:rgba(100,116,139,0.9);opacity:0;animation:riseIn 0.8s ease 1.6s forwards}
      .sb{fill:rgba(0,255,204,0.05);stroke:rgba(0,255,204,0.2);stroke-width:1;opacity:0;animation:fadeIn 0.6s ease 1.9s forwards}
      .sn{font-family:'Courier New',monospace;font-size:18px;font-weight:900;fill:#00ffcc;opacity:0;animation:fadeIn 0.6s ease 2.1s forwards}
      .sl{font-family:'Courier New',monospace;font-size:8.5px;letter-spacing:1.2px;fill:rgba(100,116,139,0.9);opacity:0;animation:fadeIn 0.6s ease 2.3s forwards}
      .star{animation:twinkle 3s ease-in-out infinite}
      @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes drawLine{to{stroke-dashoffset:0}}
      @keyframes twinkle{0%,100%{opacity:.7}50%{opacity:.1}}
      @keyframes pd{0%,100%{opacity:1;r:3.5}50%{opacity:0.25;r:2}}
      .d1{animation:pd 2.2s ease-in-out infinite}
      .d2{animation:pd 2.2s ease-in-out 0.4s infinite}
      .d3{animation:pd 2.2s ease-in-out 0.8s infinite}
    </style>
    <linearGradient id="gn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect class="bg-main" width="900" height="300"/>

  <line class="gl" x1="0" y1="50"  x2="900" y2="50"/>
  <line class="gl" x1="0" y1="100" x2="900" y2="100"/>
  <line class="gl" x1="0" y1="150" x2="900" y2="150"/>
  <line class="gl" x1="0" y1="200" x2="900" y2="200"/>
  <line class="gl" x1="0" y1="250" x2="900" y2="250"/>
  <line class="gl-v" x1="100" y1="0" x2="100" y2="300"/>
  <line class="gl-v" x1="200" y1="0" x2="200" y2="300"/>
  <line class="gl-v" x1="300" y1="0" x2="300" y2="300"/>
  <line class="gl-v" x1="400" y1="0" x2="400" y2="300"/>
  <line class="gl-v" x1="500" y1="0" x2="500" y2="300"/>
  <line class="gl-v" x1="600" y1="0" x2="600" y2="300"/>
  <line class="gl-v" x1="700" y1="0" x2="700" y2="300"/>
  <line class="gl-v" x1="800" y1="0" x2="800" y2="300"/>

  <rect class="scan-bar" x="0" y="0" width="900" height="4"/>

  <polyline class="cl" points="22,55 22,22 55,22"/>
  <polyline class="cl" points="845,22 878,22 878,55"/>
  <polyline class="cl" points="22,245 22,278 55,278"/>
  <polyline class="cl" points="845,278 878,278 878,245"/>

  <circle class="star" cx="55"  cy="38"  r="1.3" style="animation-delay:0s"   fill="#fff"/>
  <circle class="star" cx="848" cy="42"  r="1.1" style="animation-delay:.9s"  fill="#fff"/>
  <circle class="star" cx="160" cy="262" r="1.2" style="animation-delay:.4s"  fill="#fff"/>
  <circle class="star" cx="740" cy="258" r="1.0" style="animation-delay:1.5s" fill="#fff"/>
  <circle class="star" cx="310" cy="45"  r="0.9" style="animation-delay:2.1s" fill="#fff"/>
  <circle class="star" cx="620" cy="268" r="1.1" style="animation-delay:0.7s" fill="#fff"/>

  <text class="name-t" x="450" y="130" text-anchor="middle">Ameer Abdullah</text>

  <line class="bar-l" x1="85"  y1="152" x2="310" y2="152"/>
  <line class="bar-r" x1="590" y1="152" x2="815" y2="152"/>

  <text class="role-t" x="450" y="174" text-anchor="middle">DATA SCIENTIST  ·  AI ENGINEER  ·  LLM BUILDER</text>
  <text class="tag-t"  x="450" y="200" text-anchor="middle">FAST NUCES LAHORE  ·  OPEN TO OPPORTUNITIES</text>

  <rect class="sb" x="130" y="218" width="90" height="46" rx="4"/>
  <rect class="sb" x="250" y="218" width="90" height="46" rx="4"/>
  <rect class="sb" x="370" y="218" width="90" height="46" rx="4"/>
  <rect class="sb" x="490" y="218" width="90" height="46" rx="4"/>
  <rect class="sb" x="610" y="218" width="90" height="46" rx="4"/>

  <text class="sn" x="175" y="238" text-anchor="middle">3</text>
  <text class="sn" x="295" y="238" text-anchor="middle">97%</text>
  <text class="sn" x="415" y="238" text-anchor="middle">4.5M</text>
  <text class="sn" x="535" y="238" text-anchor="middle">100%</text>
  <text class="sn" x="655" y="238" text-anchor="middle" style="fill:#a78bfa">2025</text>

  <text class="sl" x="175" y="254" text-anchor="middle">PROJECTS</text>
  <text class="sl" x="295" y="254" text-anchor="middle">ACCURACY</text>
  <text class="sl" x="415" y="254" text-anchor="middle">TRAIN STEPS</text>
  <text class="sl" x="535" y="254" text-anchor="middle">PASS RATE</text>
  <text class="sl" x="655" y="254" text-anchor="middle">GRADUATED</text>

  <circle class="d1" cx="420" cy="278" r="3.5" fill="#00ffcc"/>
  <circle class="d2" cx="433" cy="278" r="3.5" fill="#a78bfa"/>
  <circle class="d3" cx="446" cy="278" r="3.5" fill="#00ffcc"/>
</svg>
