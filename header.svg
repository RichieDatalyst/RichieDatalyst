<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;family=Space+Mono:wght@400;700&amp;display=swap');

      .bg { fill: #030712; }
      .grid-line { stroke: rgba(0,255,204,0.06); stroke-width: 0.5; fill: none; }

      .name {
        font-family: 'Orbitron', 'Courier New', monospace;
        font-size: 52px;
        font-weight: 900;
        fill: url(#nameGrad);
        opacity: 0;
        animation: fadeSlideIn 1s ease 0.3s forwards;
      }
      .role {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 15px;
        fill: rgba(0,255,204,0.7);
        letter-spacing: 0.16em;
        opacity: 0;
        animation: fadeSlideIn 1s ease 0.8s forwards;
      }
      .tagline {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 12px;
        fill: rgba(100,116,139,1);
        letter-spacing: 0.08em;
        opacity: 0;
        animation: fadeSlideIn 1s ease 1.2s forwards;
      }
      .bar {
        fill: none;
        stroke-width: 1.5;
        opacity: 0;
        animation: fadeSlideIn 0.8s ease 1.5s forwards;
      }
      .bar-teal { stroke: rgba(0,255,204,0.5); }
      .bar-purple { stroke: rgba(124,58,237,0.5); }

      .dot {
        animation: pulse 2s ease-in-out infinite;
      }
      .dot1 { fill: #00ffcc; cx: 450; cy: 260; r: 3; animation-delay: 0s; }
      .dot2 { fill: #7c3aed; animation-delay: 0.6s; }
      .dot3 { fill: #00ffcc; animation-delay: 1.2s; }

      .corner { stroke: rgba(0,255,204,0.3); stroke-width: 1.5; fill: none;
        opacity: 0; animation: fadeIn 0.8s ease 1.8s forwards; }

      .scan {
        fill: rgba(0,255,204,0.04);
        animation: scanAnim 3s linear infinite;
      }
      .star { fill: rgba(255,255,255,0.6); animation: twinkle 3s ease-in-out infinite; }

      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pulse {
        0%,100% { opacity: 1; r: 3; }
        50%      { opacity: 0.3; r: 2; }
      }
      @keyframes scanAnim {
        0%   { y: 0; opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { y: 280px; opacity: 0; }
      }
      @keyframes twinkle {
        0%,100% { opacity: 0.6; }
        50%      { opacity: 0.1; }
      }
    </style>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect class="bg" width="900" height="280" rx="0"/>

  <!-- grid -->
  <line class="grid-line" x1="0" y1="45" x2="900" y2="45"/>
  <line class="grid-line" x1="0" y1="90" x2="900" y2="90"/>
  <line class="grid-line" x1="0" y1="135" x2="900" y2="135"/>
  <line class="grid-line" x1="0" y1="180" x2="900" y2="180"/>
  <line class="grid-line" x1="0" y1="225" x2="900" y2="225"/>
  <line class="grid-line" x1="90" y1="0" x2="90" y2="280"/>
  <line class="grid-line" x1="180" y1="0" x2="180" y2="280"/>
  <line class="grid-line" x1="270" y1="0" x2="270" y2="280"/>
  <line class="grid-line" x1="360" y1="0" x2="360" y2="280"/>
  <line class="grid-line" x1="450" y1="0" x2="450" y2="280"/>
  <line class="grid-line" x1="540" y1="0" x2="540" y2="280"/>
  <line class="grid-line" x1="630" y1="0" x2="630" y2="280"/>
  <line class="grid-line" x1="720" y1="0" x2="720" y2="280"/>
  <line class="grid-line" x1="810" y1="0" x2="810" y2="280"/>

  <!-- scan line -->
  <rect class="scan" x="0" width="900" height="3"/>

  <!-- corner accents -->
  <polyline class="corner" points="20,50 20,20 50,20"/>
  <polyline class="corner" points="850,20 880,20 880,50"/>
  <polyline class="corner" points="20,230 20,260 50,260"/>
  <polyline class="corner" points="850,260 880,260 880,230"/>

  <!-- stars -->
  <circle class="star" cx="60" cy="40" r="1.2" style="animation-delay:0s"/>
  <circle class="star" cx="840" cy="60" r="1" style="animation-delay:0.7s"/>
  <circle class="star" cx="120" cy="240" r="1.3" style="animation-delay:1.4s"/>
  <circle class="star" cx="780" cy="230" r="1.1" style="animation-delay:0.3s"/>
  <circle class="star" cx="200" cy="50" r="0.9" style="animation-delay:1.8s"/>
  <circle class="star" cx="700" cy="250" r="1.2" style="animation-delay:0.9s"/>

  <!-- name -->
  <text class="name" x="450" y="128" text-anchor="middle">Ameer Abdullah</text>

  <!-- horizontal bars -->
  <line class="bar bar-teal" x1="100" y1="148" x2="360" y2="148"/>
  <line class="bar bar-purple" x1="540" y1="148" x2="800" y2="148"/>

  <!-- role -->
  <text class="role" x="450" y="175" text-anchor="middle">DATA SCIENTIST  ·  AI ENGINEER  ·  LLM BUILDER</text>

  <!-- tagline -->
  <text class="tagline" x="450" y="205" text-anchor="middle">FAST NUCES LAHORE  ·  97% MODEL ACCURACY  ·  100% TEST PASS RATE  ·  OPEN TO HIRE</text>

  <!-- dots -->
  <circle class="dot dot1" cx="430" cy="225" r="3"/>
  <circle class="dot dot2" cx="450" cy="225" r="3" fill="#7c3aed"/>
  <circle class="dot dot3" cx="470" cy="225" r="3" fill="#00ffcc"/>
</svg>
