<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Deep space gradient -->
    <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000305"/>
      <stop offset="50%" style="stop-color:#001a1a"/>
      <stop offset="100%" style="stop-color:#000305"/>
    </linearGradient>
    
    <!-- 3D cube gradients -->
    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc"/>
      <stop offset="100%" style="stop-color:#0088aa"/>
    </linearGradient>
    
    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ccff"/>
      <stop offset="100%" style="stop-color:#0066aa"/>
    </linearGradient>
    
    <linearGradient id="cubeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3366"/>
      <stop offset="100%" style="stop-color:#aa0044"/>
    </linearGradient>
    
    <!-- Glow filters -->
    <filter id="glow3d" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Grid pattern -->
    <pattern id="grid3d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ffcc" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#space)"/>
  <rect width="1200" height="300" fill="url(#grid3d)"/>
  
  <!-- Animated floating cubes -->
  <g opacity="0.7">
    <g>
      <rect x="80" y="100" width="30" height="30" fill="url(#cubeGrad1)" opacity="0.6" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="130" y="140" width="25" height="25" fill="url(#cubeGrad2)" opacity="0.5" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,20; 0,0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="180" width="20" height="20" fill="url(#cubeGrad3)" opacity="0.4" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <g>
      <rect x="1090" y="90" width="28" height="28" fill="url(#cubeGrad2)" opacity="0.6" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,18; 0,0" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="1130" y="150" width="22" height="22" fill="url(#cubeGrad1)" opacity="0.5" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1070" y="190" width="26" height="26" fill="url(#cubeGrad3)" opacity="0.4" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,15; 0,0" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  
  <!-- Isometric platform -->
  <polygon points="300,220 900,220 1050,180 450,180" fill="#00ffcc" opacity="0.08" filter="url(#glow3d)"/>
  <polygon points="300,220 900,220 900,240 300,240" fill="#00ccff" opacity="0.05"/>
  
  <!-- CENTRAL INTERACTIVE ELEMENT: Rotating 3D Cube Cluster -->
  <g transform="translate(600, 140)">
    <!-- Connection lines between cubes -->
    <g stroke="#00ffcc" stroke-width="1" opacity="0.4">
      <line x1="-40" y1="-30" x2="40" y2="-30">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="-40" y1="30" x2="40" y2="30">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </line>
      <line x1="-40" y1="-30" x2="-40" y2="30">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </line>
      <line x1="40" y1="-30" x2="40" y2="30">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </line>
    </g>
    
    <!-- Main rotating cube group -->
    <g>
      <!-- Back face -->
      <rect x="-35" y="-25" width="70" height="50" fill="url(#cubeGrad1)" opacity="0.3" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Front face -->
      <rect x="-30" y="-20" width="60" height="40" fill="url(#cubeGrad2)" opacity="0.4" filter="url(#glow3d)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="10s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Side faces -->
      <rect x="-35" y="-25" width="10" height="50" fill="url(#cubeGrad3)" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="25" y="-25" width="10" height="50" fill="url(#cubeGrad1)" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Top and bottom -->
      <rect x="-35" y="-25" width="70" height="10" fill="url(#cubeGrad2)" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-35" y="15" width="70" height="10" fill="url(#cubeGrad3)" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Inner rotating core -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ff3366" stroke-width="2" opacity="0.8" filter="url(#strongGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Pulsing center node -->
    <circle cx="0" cy="0" r="6" fill="#00ffcc" filter="url(#strongGlow)" opacity="0.9">
      <animate attributeName="r" values="6;9;6" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Neural network connections radiating from center -->
  <g stroke="#00ffcc" stroke-width="1" opacity="0.3">
    <line x1="600" y1="140" x2="450" y2="100">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="140" x2="750" y2="100">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="140" x2="420" y2="180">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="140" x2="780" y2="180">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Orbiting rings -->
  <ellipse cx="600" cy="140" rx="180" ry="40" fill="none" stroke="#00ffcc" stroke-width="1" opacity="0.2" transform="rotate(-15 600 140)">
    <animateTransform attributeName="transform" type="rotate" from="-15 600 140" to="345 600 140" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="140" rx="220" ry="50" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.15" transform="rotate(10 600 140)">
    <animateTransform attributeName="transform" type="rotate" from="10 600 140" to="-350 600 140" dur="25s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Data stream lines -->
  <g stroke="#00ffcc" stroke-width="1" opacity="0.3">
    <line x1="200" y1="100" x2="400" y2="140">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="1000" y1="100" x2="800" y2="140">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="180" x2="420" y2="160">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="950" y1="180" x2="780" y2="160">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- MAIN NAME with 3D effect -->
  <g transform="translate(600, 120)">
    <text x="8" y="8" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#000305" text-anchor="middle" opacity="0.4" letter-spacing="6">AMEER ABDULLAH</text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#00ffcc" text-anchor="middle" filter="url(#strongGlow)" letter-spacing="6">AMEER ABDULLAH</text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.3" letter-spacing="6">AMEER ABDULLAH</text>
  </g>
  
  <!-- Subtitle -->
  <g transform="translate(600, 165)">
    <rect x="-280" y="-18" width="560" height="28" rx="4" fill="#00ffcc" opacity="0.1">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="3" font-family="'Courier New', monospace" font-size="13" fill="#44aaaa" text-anchor="middle" letter-spacing="4">DATA SCIENTIST / AI/ML ENTHUSIAST / FAST NUCES 2025</text>
  </g>
  
  <!-- Animated tech icons -->
  <g fill="#00ffcc" opacity="0.6" filter="url(#glow3d)">
    <g transform="translate(380, 110)">
      <rect x="0" y="0" width="24" height="24" rx="3" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="380,110; 385,105; 380,110" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="12" y="17" font-family="Arial" font-size="14" fill="#00ffcc" text-anchor="middle" opacity="0.8">Py</text>
    </g>
    
    <g transform="translate(820, 120)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="820,120; 815,125; 820,120" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" font-family="Arial" font-size="12" fill="#00ccff" text-anchor="middle" opacity="0.8">AI</text>
    </g>
    
    <g transform="translate(350, 190)">
      <ellipse cx="0" cy="0" rx="12" ry="6" fill="none" stroke="#ff3366" stroke-width="1.2" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="350,190; 355,185; 350,190" dur="3.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="12" ry="6" fill="none" stroke="#ff3366" stroke-width="1.2" opacity="0.6" transform="translate(0, 6)"/>
      <ellipse cx="0" cy="0" rx="12" ry="6" fill="none" stroke="#ff3366" stroke-width="1.2" opacity="0.6" transform="translate(0, 12)"/>
    </g>
    
    <g transform="translate(870, 180)">
      <path d="M -10,5 Q -10,-3 -5,-3 Q -3,-8 3,-8 Q 8,-8 10,-3 Q 15,-3 15,5 Q 15,12 8,12 Q 5,15 0,15 Q -5,15 -7,12 Q -10,12 -10,5" fill="none" stroke="#00ffcc" stroke-width="1.2" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="870,180; 865,185; 870,180" dur="4.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- Corner brackets -->
  <g stroke="#00ffcc" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="40,40 40,60 20,60">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="1160,40 1160,60 1180,60">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </polyline>
    <polyline points="40,260 40,240 20,240">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="1s"/>
    </polyline>
    <polyline points="1160,260 1160,240 1180,240">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </polyline>
  </g>
  
  <!-- Bottom tech stack -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#00ffcc">
    <rect x="150" y="245" width="70" height="18" rx="3" fill="#00ffcc" opacity="0.15" stroke="#00ffcc" stroke-width="0.8"/>
    <text x="185" y="258" text-anchor="middle" opacity="0.9">PYTORCH</text>
    
    <rect x="230" y="245" width="75" height="18" rx="3" fill="#00ccff" opacity="0.15" stroke="#00ccff" stroke-width="0.8"/>
    <text x="268" y="258" text-anchor="middle" opacity="0.9">LANGGRAPH</text>
    
    <rect x="315" y="245" width="60" height="18" rx="3" fill="#ff3366" opacity="0.15" stroke="#ff3366" stroke-width="0.8"/>
    <text x="345" y="258" text-anchor="middle" opacity="0.9">FASTAPI</text>
    
    <rect x="385" y="245" width="50" height="18" rx="3" fill="#00ffcc" opacity="0.15" stroke="#00ffcc" stroke-width="0.8"/>
    <text x="410" y="258" text-anchor="middle" opacity="0.9">NLP</text>
    
    <rect x="445" y="245" width="50" height="18" rx="3" fill="#00ccff" opacity="0.15" stroke="#00ccff" stroke-width="0.8"/>
    <text x="470" y="258" text-anchor="middle" opacity="0.9">RAG</text>
    
    <rect x="705" y="245" width="60" height="18" rx="3" fill="#00ffcc" opacity="0.15" stroke="#00ffcc" stroke-width="0.8"/>
    <text x="735" y="258" text-anchor="middle" opacity="0.9">MLFLOW</text>
    
    <rect x="775" y="245" width="50" height="18" rx="3" fill="#ff3366" opacity="0.15" stroke="#ff3366" stroke-width="0.8"/>
    <text x="800" y="258" text-anchor="middle" opacity="0.9">SHAP</text>
    
    <rect x="835" y="245" width="70" height="18" rx="3" fill="#00ccff" opacity="0.15" stroke="#00ccff" stroke-width="0.8"/>
    <text x="870" y="258" text-anchor="middle" opacity="0.9">STREAMLIT</text>
    
    <rect x="915" y="245" width="60" height="18" rx="3" fill="#00ffcc" opacity="0.15" stroke="#00ffcc" stroke-width="0.8"/>
    <text x="945" y="258" text-anchor="middle" opacity="0.9">GEMINI</text>
    
    <rect x="985" y="245" width="65" height="18" rx="3" fill="#ff3366" opacity="0.15" stroke="#ff3366" stroke-width="0.8"/>
    <text x="1018" y="258" text-anchor="middle" opacity="0.9">POWER BI</text>
  </g>
  
  <!-- Pulsing particles -->
  <g fill="#00ffcc" opacity="0.4">
    <circle cx="200" cy="80" r="2">
      <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="90" r="2">
      <animate attributeName="cy" values="90;100;90" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="200" r="1.5">
      <animate attributeName="cy" values="200;190;200" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="210" r="1.5">
      <animate attributeName="cy" values="210;220;210" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Status line -->
  <text x="60" y="285" font-family="'Courier New', monospace" font-size="8" fill="#00ffcc" opacity="0.4" letter-spacing="2">● OPEN TO OPPORTUNITIES</text>
  <text x="1140" y="285" font-family="'Courier New', monospace" font-size="8" fill="#00ffcc" opacity="0.4" letter-spacing="2" text-anchor="end">LAHORE, PAKISTAN</text>
</svg>